{{template "email-top" .}}
                    <td style="padding:24px 30px 30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#333333;">
                        <h1 style="color:#2563eb;margin:0 0 20px;font-size:24px;font-weight:bold;">{{index .Content "heading"}}</h1>

                        <p style="margin:0 0 16px;">{{index .Labels "greeting_prefix"}} {{.Name}},</p>

                        <p style="margin:0 0 16px;">{{index .Content "intro_text"}}</p>

                        <p style="margin:0 0 16px;white-space:pre-line;">{{index .Content "next_steps_text"}}</p>

                        <p style="margin:0 0 20px;white-space:pre-line;">{{index .Content "wiki_text"}}</p>

                        <!-- Button -->
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0;">
                            <tr>
                                <td style="background:#2563eb;border-radius:6px;">
                                    <a href="{{.PortalURL}}" style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-weight:bold;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;">{{index .Labels "button_portal"}}</a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
{{template "email-bottom" .}}
